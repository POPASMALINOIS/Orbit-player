name: iOS Build Report

on:
  push:
    branches:
      - ci/verify-mvp

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ci/verify-mvp

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and record result
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project OrbitPlayer.xcodeproj \
            -scheme OrbitPlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          mkdir -p ci
          rm -f ci/status-success.txt ci/status-failure.txt ci/error-*.txt

          if [ "$BUILD_STATUS" -eq 0 ]; then
            printf 'Orbit Player compila correctamente para el simulador de iOS.\n' > ci/status-success.txt
          else
            printf 'La compilación ha fallado.\n\n' > ci/status-failure.txt
            grep -E 'error:|BUILD FAILED|Command .* failed' build.log | tail -n 80 >> ci/status-failure.txt || true
            grep -qi 'AppIcon\|app icon\|asset catalog' build.log && touch ci/error-appicon.txt || true
            grep -qi 'concurrency\|main actor\|sendable\|sending' build.log && touch ci/error-concurrency.txt || true
            grep -qi 'no such module\|cannot find.*in scope\|has no member' build.log && touch ci/error-symbol.txt || true
            grep -qi 'ambiguous\|type of expression is ambiguous\|generic parameter' build.log && touch ci/error-type-inference.txt || true
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci
          git commit -m 'ci: record iOS build result [skip ci]' || true
          git push origin HEAD:ci/verify-mvp

          exit "$BUILD_STATUS"
