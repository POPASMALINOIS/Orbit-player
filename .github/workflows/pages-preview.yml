name: Publish Orbit Player PWA

on:
  push:
    branches:
      - main
    paths:
      - "Preview/**"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbit-player-gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PWA JavaScript
        run: |
          node --check Preview/app.js
          node --check Preview/enhancements.js

      - name: Prepare gh-pages worktree
        run: |
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/orbit-gh-pages
          git worktree add /tmp/orbit-gh-pages gh-pages

      - name: Copy PWA
        run: |
          find /tmp/orbit-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R Preview/. /tmp/orbit-gh-pages/
          touch /tmp/orbit-gh-pages/.nojekyll

      - name: Publish changes
        working-directory: /tmp/orbit-gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar"
            exit 0
          fi
          git commit -m "deploy: publish Orbit Player PWA"
          git push origin gh-pages
