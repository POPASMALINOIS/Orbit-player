name: Deploy Orbit Player Preview

on:
  push:
    branches:
      - main
    paths:
      - "Preview/**"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: orbit-player-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: Preview

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
