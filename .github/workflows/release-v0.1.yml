name: Release Orbit Player 0.1.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate a valid local app icon
        shell: bash
        run: |
          cat > /tmp/orbit-icon.swift <<'SWIFT'
          import AppKit

          let pixels = 1024
          guard let bitmap = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: pixels,
              pixelsHigh: pixels,
              bitsPerSample: 8,
              samplesPerPixel: 4,
              hasAlpha: true,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: 0,
              bitsPerPixel: 0
          ) else { fatalError("No se pudo crear el icono") }

          bitmap.size = NSSize(width: pixels, height: pixels)
          guard let context = NSGraphicsContext(bitmapImageRep: bitmap) else {
              fatalError("No se pudo crear el contexto")
          }

          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = context

          let canvas = NSRect(x: 0, y: 0, width: pixels, height: pixels)
          NSGradient(colors: [
              NSColor(calibratedRed: 0.12, green: 0.13, blue: 0.15, alpha: 1),
              NSColor(calibratedRed: 0.015, green: 0.018, blue: 0.024, alpha: 1)
          ])!.draw(in: canvas, angle: -55)

          let ringRect = NSRect(x: 190, y: 190, width: 644, height: 644)
          NSColor(calibratedRed: 0.20, green: 0.67, blue: 0.98, alpha: 0.10).setFill()
          NSBezierPath(ovalIn: ringRect.insetBy(dx: -65, dy: -65)).fill()

          let ring = NSBezierPath(ovalIn: ringRect)
          ring.lineWidth = 70
          NSColor(calibratedWhite: 0.91, alpha: 0.90).setStroke()
          ring.stroke()

          let dot = NSRect(x: 727, y: 686, width: 92, height: 92)
          NSColor(calibratedRed: 0.20, green: 0.67, blue: 0.98, alpha: 1).setFill()
          NSBezierPath(ovalIn: dot).fill()

          NSGraphicsContext.restoreGraphicsState()

          let output = URL(fileURLWithPath: "OrbitPlayer/Resources/Assets.xcassets/AppIcon.appiconset/OrbitPlayerIcon.png")
          try bitmap.representation(using: .png, properties: [:])!.write(to: output, options: .atomic)
          SWIFT
          swift /tmp/orbit-icon.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project OrbitPlayer.xcodeproj \
            -scheme OrbitPlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package source
        run: |
          mkdir -p release
          git archive --format=zip --output=release/OrbitPlayer-0.1.0-source.zip HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 --repo POPASMALINOIS/Orbit-player >/dev/null 2>&1; then
            gh release upload v0.1.0 release/OrbitPlayer-0.1.0-source.zip --repo POPASMALINOIS/Orbit-player --clobber
          else
            gh release create v0.1.0 \
              release/OrbitPlayer-0.1.0-source.zip \
              --repo POPASMALINOIS/Orbit-player \
              --target main \
              --title 'Orbit Player 0.1.0' \
              --notes 'Primer MVP nativo: rueda táctil, biblioteca local, reproducción de audio y vídeo, favoritos y diseño original.'
          fi
