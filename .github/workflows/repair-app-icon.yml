name: Normalize Orbit Player App Icon

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  normalize-icon:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate the original 1024 px icon
        shell: bash
        run: |
          cat > /tmp/orbit-icon.swift <<'SWIFT'
          import AppKit

          let pixels = 1024
          guard let bitmap = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: pixels,
              pixelsHigh: pixels,
              bitsPerSample: 8,
              samplesPerPixel: 4,
              hasAlpha: true,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: 0,
              bitsPerPixel: 0
          ) else { fatalError("No se pudo crear el icono") }

          bitmap.size = NSSize(width: pixels, height: pixels)
          guard let context = NSGraphicsContext(bitmapImageRep: bitmap) else {
              fatalError("No se pudo crear el contexto")
          }

          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = context

          let canvas = NSRect(x: 0, y: 0, width: pixels, height: pixels)
          NSGradient(colors: [
              NSColor(calibratedRed: 0.12, green: 0.13, blue: 0.15, alpha: 1),
              NSColor(calibratedRed: 0.015, green: 0.018, blue: 0.024, alpha: 1)
          ])!.draw(in: canvas, angle: -55)

          let ringRect = NSRect(x: 190, y: 190, width: 644, height: 644)
          NSColor(calibratedRed: 0.20, green: 0.67, blue: 0.98, alpha: 0.10).setFill()
          NSBezierPath(ovalIn: ringRect.insetBy(dx: -65, dy: -65)).fill()

          let ring = NSBezierPath(ovalIn: ringRect)
          ring.lineWidth = 70
          NSColor(calibratedWhite: 0.91, alpha: 0.90).setStroke()
          ring.stroke()

          let innerRing = NSBezierPath(ovalIn: ringRect.insetBy(dx: 92, dy: 92))
          innerRing.lineWidth = 4
          NSColor(calibratedWhite: 1, alpha: 0.10).setStroke()
          innerRing.stroke()

          let dot = NSRect(x: 727, y: 686, width: 92, height: 92)
          NSColor(calibratedRed: 0.20, green: 0.67, blue: 0.98, alpha: 1).setFill()
          NSBezierPath(ovalIn: dot).fill()

          let dotHighlight = NSBezierPath(ovalIn: dot.insetBy(dx: 24, dy: 24))
          NSColor(calibratedWhite: 1, alpha: 0.45).setFill()
          dotHighlight.fill()

          NSGraphicsContext.restoreGraphicsState()

          let output = URL(fileURLWithPath: "OrbitPlayer/Resources/Assets.xcassets/AppIcon.appiconset/OrbitPlayerIcon.png")
          try bitmap.representation(using: .png, properties: [:])!.write(to: output, options: .atomic)
          SWIFT

          swift /tmp/orbit-icon.swift
          sips -g pixelWidth -g pixelHeight OrbitPlayer/Resources/Assets.xcassets/AppIcon.appiconset/OrbitPlayerIcon.png

      - name: Commit the normalized asset
        shell: bash
        run: |
          if git diff --quiet -- OrbitPlayer/Resources/Assets.xcassets/AppIcon.appiconset/OrbitPlayerIcon.png; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OrbitPlayer/Resources/Assets.xcassets/AppIcon.appiconset/OrbitPlayerIcon.png
          git commit -m 'style: normalize the Orbit Player app icon [skip ci]'
          git push origin HEAD:main
