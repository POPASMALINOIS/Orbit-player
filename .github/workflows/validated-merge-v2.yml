name: Validate, Repair Assets and Merge

on:
  push:
    branches:
      - ci/verify-mvp

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: ci/verify-mvp
          fetch-depth: 0

      - name: Generate a valid original 1024 px app icon
        shell: bash
        run: |
          cat > /tmp/orbit-icon.swift <<'SWIFT'
          import AppKit

          let pixels = 1024
          guard let bitmap = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: pixels,
              pixelsHigh: pixels,
              bitsPerSample: 8,
              samplesPerPixel: 4,
              hasAlpha: true,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: 0,
              bitsPerPixel: 0
          ) else {
              fatalError("No se pudo crear el mapa de bits")
          }

          bitmap.size = NSSize(width: pixels, height: pixels)
          guard let context = NSGraphicsContext(bitmapImageRep: bitmap) else {
              fatalError("No se pudo crear el contexto gráfico")
          }

          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = context

          let canvas = NSRect(x: 0, y: 0, width: pixels, height: pixels)
          let background = NSGradient(colors: [
              NSColor(calibratedRed: 0.12, green: 0.13, blue: 0.15, alpha: 1),
              NSColor(calibratedRed: 0.015, green: 0.018, blue: 0.024, alpha: 1)
          ])!
          background.draw(in: canvas, angle: -55)

          let glowRect = NSRect(x: 190, y: 190, width: 644, height: 644)
          NSColor(calibratedRed: 0.20, green: 0.67, blue: 0.98, alpha: 0.10).setFill()
          NSBezierPath(ovalIn: glowRect.insetBy(dx: -65, dy: -65)).fill()

          let ring = NSBezierPath(ovalIn: glowRect)
          ring.lineWidth = 70
          NSColor(calibratedWhite: 0.91, alpha: 0.90).setStroke()
          ring.stroke()

          let inner = NSBezierPath(ovalIn: glowRect.insetBy(dx: 92, dy: 92))
          inner.lineWidth = 4
          NSColor(calibratedWhite: 1, alpha: 0.10).setStroke()
          inner.stroke()

          let dotRect = NSRect(x: 727, y: 686, width: 92, height: 92)
          NSColor(calibratedRed: 0.20, green: 0.67, blue: 0.98, alpha: 1).setFill()
          NSBezierPath(ovalIn: dotRect).fill()

          let highlight = NSBezierPath(ovalIn: dotRect.insetBy(dx: 24, dy: 24))
          NSColor(calibratedWhite: 1, alpha: 0.45).setFill()
          highlight.fill()

          NSGraphicsContext.restoreGraphicsState()

          guard let data = bitmap.representation(using: .png, properties: [:]) else {
              fatalError("No se pudo codificar el icono")
          }

          let output = URL(fileURLWithPath: "OrbitPlayer/Resources/Assets.xcassets/AppIcon.appiconset/OrbitPlayerIcon.png")
          try data.write(to: output, options: .atomic)
          SWIFT

          swift /tmp/orbit-icon.swift
          sips -g pixelWidth -g pixelHeight OrbitPlayer/Resources/Assets.xcassets/AppIcon.appiconset/OrbitPlayerIcon.png

          if ! git diff --quiet -- OrbitPlayer/Resources/Assets.xcassets/AppIcon.appiconset/OrbitPlayerIcon.png; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add OrbitPlayer/Resources/Assets.xcassets/AppIcon.appiconset/OrbitPlayerIcon.png
            git commit -m 'style: generate a valid Orbit Player app icon [skip ci]'
            git push origin HEAD:ci/verify-mvp
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Orbit Player for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project OrbitPlayer.xcodeproj \
            -scheme OrbitPlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Merge the validated pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge 1 --repo POPASMALINOIS/Orbit-player --squash --delete-branch
