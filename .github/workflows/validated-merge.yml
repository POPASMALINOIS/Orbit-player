name: Validate and Merge Orbit Player MVP

on:
  push:
    branches:
      - ci/verify-mvp

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Orbit Player for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project OrbitPlayer.xcodeproj \
            -scheme OrbitPlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Merge validated pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge 1 --repo POPASMALINOIS/Orbit-player --squash --delete-branch
