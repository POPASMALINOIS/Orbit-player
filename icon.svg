<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Orbit Player">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242832"/>
      <stop offset="1" stop-color="#050609"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3aaaf7" stop-opacity=".24"/>
      <stop offset="1" stop-color="#3aaaf7" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="390" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="304" fill="none" stroke="#f2f5f8" stroke-opacity=".92" stroke-width="70"/>
  <circle cx="512" cy="512" r="215" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="4"/>
  <circle cx="772" cy="722" r="62" fill="#3aaaf7" filter="url(#shadow)" opacity=".75"/>
  <circle cx="772" cy="722" r="46" fill="#3aaaf7"/>
  <circle cx="759" cy="737" r="14" fill="#fff" fill-opacity=".48"/>
</svg>
