<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101218">
  <meta name="robots" content="noindex">
  <title>Orbit Player</title>
  <link rel="canonical" href="./Preview/">
  <meta http-equiv="refresh" content="0; url=./Preview/">
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at top, #1c2634, #08090c 70%); color: #fff; }
    main { width: min(88vw, 420px); text-align: center; padding: 32px; border: 1px solid rgba(255,255,255,.12); border-radius: 28px; background: rgba(255,255,255,.055); backdrop-filter: blur(18px); }
    .mark { width: 66px; height: 66px; margin: 0 auto 18px; border: 7px solid rgba(255,255,255,.88); border-right-color: #3aaaf8; border-radius: 50%; box-shadow: 0 0 28px rgba(58,170,248,.28); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 22px; color: rgba(255,255,255,.66); line-height: 1.45; }
    a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 22px; border-radius: 999px; background: #3aaaf8; color: #06101a; font-weight: 750; text-decoration: none; }
  </style>
  <script>window.location.replace('./Preview/');</script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Orbit Player</h1>
    <p>Abriendo la demostración táctil…</p>
    <a href="./Preview/">Abrir Orbit Player</a>
  </main>
</body>
</html>
