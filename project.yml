name: OrbitPlayer
options:
  bundleIdPrefix: com.gesempa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: es
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  OrbitPlayer:
    type: application
    platform: iOS
    sources:
      - path: OrbitPlayer
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gesempa.orbitplayer
        PRODUCT_NAME: OrbitPlayer
        INFOPLIST_FILE: OrbitPlayer/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  OrbitPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OrbitPlayerTests
    dependencies:
      - target: OrbitPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gesempa.orbitplayer.tests
schemes:
  OrbitPlayer:
    build:
      targets:
        OrbitPlayer: all
        OrbitPlayerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OrbitPlayerTests
    archive:
      config: Release
